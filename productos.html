<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Productos | Coches de ocasión</title>
  <link rel="stylesheet" href="css/estilos.css">
</head>
<body id="productos">
  <a class="skip-link" href="#main-content">Saltar al contenido</a>

  <div id="cabecera"></div>

  <main id="main-content" class="container">
    <section class="intro">
      <h1>Catálogo de coches</h1>
      <p>Elige una marca para consultar sus modelos de segunda mano.</p>
    </section>

    <section aria-labelledby="catalog-title">
      <div class="section-heading">
        <h2 id="catalog-title">Vehículos disponibles</h2>
      </div>

      <form class="form">
        <div class="form-field">
          <label for="marca-catalogo">Marca</label>
          <select id="marca-catalogo" name="marca" class="form-control">
            <option value="">Todas las marcas</option>
            <option>SEAT</option>
            <option>Toyota</option>
            <option>Renault</option>
            <option>Volkswagen</option>
          </select>
        </div>
      </form>
      <p id="estado-catalogo"></p>
      <ul class="card-grid" id="lista-coches"></ul>
      <p><a href="img/coches/creditos.html">Créditos de las fotografías</a></p>
    </section>
  </main>

  <div id="pie"></div>
  <script src="js/catalogo.js"></script>
  <script src="js/componentes.js"></script>
</body>
</html>
